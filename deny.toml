[advisories]
version = 2

[licenses]
version = 2
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "OpenSSL",
    "Unicode-DFS-2016",
    "Unicode-3.0",
    "Zlib",
    "CC0-1.0",
]

# ring bundles OpenSSL-derived and ISC-licensed code alongside its own terms.
exceptions = [
    { allow = ["ISC", "MIT", "OpenSSL"], name = "ring" },
]

[bans]
# Warn rather than deny on duplicate versions — duplicates are common in the
# Rust ecosystem and rarely a problem in practice.
multiple-versions = "warn"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
