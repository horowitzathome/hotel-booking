server:
  http_listen_port: 9080
  grpc_listen_port: 0
  log_level: warn

positions:
  filename: /tmp/positions.yaml

clients:
  - url: http://loki:3100/loki/api/v1/push

scrape_configs:
  - job_name: docker
    docker_sd_configs:
      - host: unix:///var/run/docker.sock
        refresh_interval: 5s
    relabel_configs:
      - source_labels: ['__meta_docker_container_name']
        regex: '/(.*)'
        target_label: container
      - source_labels: ['__meta_docker_container_log_stream']
        target_label: stream
    pipeline_stages:
      # Docker writes one JSON line per log event wrapping the container's stdout.
      # The `docker` stage unwraps it so subsequent stages see the raw payload.
      - docker: {}

      # For the rental-api container, parse its production JSON logs and lift
      # `level` to a Loki label so users can filter by severity in Grafana.
      - match:
          selector: '{container="rental-api"}'
          stages:
            - json:
                expressions:
                  level: level
                  target: target
            - labels:
                level:
                target:
